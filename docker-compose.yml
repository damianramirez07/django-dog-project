services:
  app:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
        - "8000:8000"
    environment:
      DB_NAME: dogdb
      DB_USER: doguser
      DB_PASSWORD: dogpassword
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

    
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dogdb
      POSTGRES_USER: doguser
      POSTGRES_PASSWORD: dogpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doguser -d dogdb"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
